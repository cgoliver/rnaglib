name: build

on: [ push ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10" ]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CD-Hit
        run: |
          wget https://github.com/weizhongli/cdhit/releases/download/V4.8.1/cd-hit-v4.8.1-2019-0228.tar.gz
          tar -xzvf cd-hit-v4.8.1-2019-0228.tar.gz
          cd cd-hit-v4.8.1-2019-0228
          make
          chmod u+x cd-hit
          pwd
      - name: Export cd-hit path
        run: |
          echo /home/runner/work/rnaglib/rnaglib/cd-hit-v4.8.1-2019-0228 >> $GITHUB_PATH
      - name: Install US-align
        run: |
          g++ -static -O3 -ffast-math -o USalign .github/vendor/USalign/USalign.cpp
          chmod u+x ./USalign
      - name: Export USalign path
        run: |
          echo /home/runner/work/rnaglib/rnaglib/ >> $GITHUB_PATH
      - name: Install rna-align
        run: |
          mkdir RNAalign
          g++ -O3 -ffast-math -o RNAalign/RNAalign .github/vendor/RNAalign/RNAalign.cpp -static
          chmod u+x RNAalign/RNAalign
          pwd
      - name: Export RNAalign path
        run: |
          echo /home/runner/work/rnaglib/rnaglib/RNAalign >> $GITHUB_PATH
      - name: Install LocARNA
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: locarna-env
          create-args: locarna
          condarc: |
            channels:
              - bioconda
              - conda-forge
          cache-environment: true
      - name: Export LocARNA path
        run: |
          echo /home/runner/micromamba/envs/locarna-env/bin >> $GITHUB_PATH
      - name: Cache RNA-FM weights
        id: cache-rnafm
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints/RNA-FM_pretrained.pth
          key: rnafm-pretrained-weights-v1
      - name: Download RNA-FM weights
        if: steps.cache-rnafm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/torch/hub/checkpoints
          wget -O ~/.cache/torch/hub/checkpoints/RNA-FM_pretrained.pth https://huggingface.co/cuhkaih/rnafm/resolve/main/RNA-FM_pretrained.pth
      - name: Test with pytest
        run: |
          echo $PATH
          which RNAalign
          which cd-hit
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
          pip install -r requirements.txt
          pip install coverage
          coverage run --source src/rnaglib -m pytest
          coverage report -m
          coverage xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: pytest
          name: rnaglib
          fail_ci_if_error: true
          verbose: true 
